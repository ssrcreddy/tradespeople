# Local development: `pnpm dev:infra` starts only Postgres and S3.
# The whole product: `docker compose -f infra/docker-compose.yml --env-file .env --profile app up --build`
name: quotes-agent

x-app-env: &app-env
  DATABASE_URL: postgres://app:${APP_DB_PASSWORD:-app}@db:5432/quotes
  APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
  BETTER_AUTH_URL: ${PUBLIC_URL:-http://localhost:3000}
  WEB_ORIGIN: ${PUBLIC_URL:-http://localhost:3000}
  INTAKE_DOMAIN: ${INTAKE_DOMAIN:-intake.localhost}
  S3_ENDPOINT: ${DOCKER_S3_ENDPOINT:-http://s3:8333}
  S3_BUCKET: ${S3_BUCKET:-quotes-dev}
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-dev-access-key}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-dev-secret-key}
  RESEND_API_KEY: ${RESEND_API_KEY:-}
  RESEND_INBOUND_SECRET: ${RESEND_INBOUND_SECRET:-}
  RESEND_EVENTS_SECRET: ${RESEND_EVENTS_SECRET:-}
  SENDER_ADDRESS: ${SENDER_ADDRESS:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  STRONG_MODEL: ${STRONG_MODEL:-}
  SENTRY_DSN: ${SENTRY_DSN:-}
  VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
  VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
  VAPID_CONTACT: ${VAPID_CONTACT:-mailto:support@example.com}
  NODE_ENV: ${APP_NODE_ENV:-production}
  # Development only, ignored in production. /app/data/dev/fake-extraction.json
  FAKE_LLM_FILE: ${DOCKER_FAKE_LLM_FILE:-}

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: quotes
    ports:
      # Unusual host port: native Postgres installs often own 5432/5433
      - "${DB_PORT:-56432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d quotes"]
      interval: 5s
      retries: 10

  # S3-compatible object storage for local dev. MinIO's official images are no
  # longer published (community edition went source-only in 2025), so local
  # dev uses SeaweedFS. Production uses Cloudflare R2 or AWS S3.
  s3:
    image: chrislusf/seaweedfs:4.50
    command: mini -dir=/data -bucket=quotes-dev -s3.config=/etc/seaweedfs/s3.json
    ports:
      - "${S3_PORT:-8333}:8333"   # S3 API
    volumes:
      - s3-data:/data
      - ./seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  migrate:
    profiles: [app]
    build: { context: .., target: api }
    command: ["node", "apps/api/src/db/migrate.ts"]
    environment:
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/quotes
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-app}
    depends_on:
      db: { condition: service_healthy }

  api:
    profiles: [app]
    build: { context: .., target: api }
    environment: *app-env
    ports:
      - "${API_PORT:-8080}:8080"
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_started }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.status<500?0:1),()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      start_period: 180s
    restart: unless-stopped

  worker:
    profiles: [app]
    build: { context: .., target: api }
    command: ["node", "apps/api/src/worker.ts"]
    environment:
      <<: *app-env
      # The only long-running process with the privileged role: it deletes businesses.
      DATABASE_ADMIN_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/quotes
    depends_on:
      migrate: { condition: service_completed_successfully }
      s3: { condition: service_started }
    restart: unless-stopped
    stop_grace_period: 40s        # drain in-flight jobs (§8)

  web:
    profiles: [app]
    build: { context: .., target: web }
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  db-data:
  s3-data:
